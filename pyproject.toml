[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "usx"
version = "0.1.0"
description = "A from-scratch ultrasound imaging engine: raw channel data to live images and quantitative maps"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
render = ["matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5"]

[project.scripts]
usx = "usx.cli:main"

[tool.scikit-build]
wheel.packages = ["python/usx"]
cmake.args = ["-DUSX_BUILD_TESTS=OFF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
